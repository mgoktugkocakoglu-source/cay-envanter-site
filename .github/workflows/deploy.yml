# GitHub Actions - Auto Deploy to Production Server
# Triggers on push to main branch
# Deploys via SSH to the production server

name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch: # Manual trigger option

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # Job 1: Run Tests & Linting
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm lint || true

      - name: Run tests
        run: pnpm test || true

  # Job 2: Deploy to Production Server
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail

            # Navigate to project directory
            cd ~/cayhesabim
            PREVIOUS_COMMIT="$(git rev-parse HEAD)"
            
            # Pull latest changes
            git fetch origin main
            git reset --hard origin/main
            
            # Create/Update .env file with secrets
            cat > .env << 'EOF'
            NODE_ENV=production
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_DATABASE=${{ secrets.DB_DATABASE }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            JWT_EXPIRES_IN=7d
            JWT_REFRESH_EXPIRES_IN=7d
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            RESEND_FROM=${{ secrets.RESEND_FROM }}
            APP_URL=${{ secrets.APP_URL }}
            R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
            R2_ENDPOINT=${{ secrets.R2_ENDPOINT }}
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
            R2_BUCKET=${{ secrets.R2_BUCKET }}
            R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}
            R2_PREFIX=${{ secrets.R2_PREFIX }}
            EOF
            
            rollback() {
              trap - ERR
              echo "Deployment failed. Rolling back to ${PREVIOUS_COMMIT}..."
              git reset --hard "${PREVIOUS_COMMIT}"
              docker compose -f docker-compose.prod.yml build
              docker compose -f docker-compose.prod.yml up -d --remove-orphans --wait --wait-timeout 180
            }
            
            show_diagnostics() {
              echo "=== API Container Status ==="
              docker inspect --format='{{.State.Status}} (health: {{.State.Health.Status}})' cayhesabim-api-prod 2>&1 || true
              echo "=== Web Container Status ==="
              docker inspect --format='{{.State.Status}} (health: {{.State.Health.Status}})' cayhesabim-web-prod 2>&1 || true
              echo "=== API Container Logs ==="
              docker logs cayhesabim-api-prod --tail 80 2>&1 || true
              echo "=== Web Container Logs ==="
              docker logs cayhesabim-web-prod --tail 80 2>&1 || true
            }
            
            check_url() {
              local name="$1"
              shift

              echo "Checking ${name}..."
              for attempt in 1 2 3 4 5; do
                if curl --fail --silent --show-error --max-time 10 "$@"; then
                  echo
                  echo "${name} is healthy."
                  return 0
                fi

                echo "${name} check failed on attempt ${attempt}/5."
                sleep 5
              done

              echo "${name} did not become healthy."
              show_diagnostics
              return 1
            }
            trap rollback ERR

            # Build first while the currently running containers keep serving traffic.
            docker compose -f docker-compose.prod.yml build

            # Do not run `down`: it removes the live containers before replacements are ready.
            docker compose -f docker-compose.prod.yml up -d --remove-orphans --wait --wait-timeout 180
            
            # Show diagnostics after Compose confirms the services are healthy.
            show_diagnostics
            echo "=== Health Check ==="
            check_url "web health endpoint" http://127.0.0.1/health
            check_url "api health endpoint through nginx" --insecure --header "Host: cayhesabim.com" https://127.0.0.1/api/health
            
            # Cleanup unused Docker resources
            docker system prune -f
            
            trap - ERR
            echo "✅ Deployment completed!"

      - name: Deployment Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "🚀 Deployment successful!"
          else
            echo "❌ Deployment failed!"
            exit 1
          fi
