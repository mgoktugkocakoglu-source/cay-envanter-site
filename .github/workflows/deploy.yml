# GitHub Actions - Auto Deploy to Production Server
# Triggers on push to main branch
# Deploys via SSH to the production server

name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch: # Manual trigger option

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # Job 1: Run Tests & Linting
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm lint || true

      - name: Run tests
        run: pnpm test || true

  # Job 2: Deploy to Production Server
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            
            # Navigate to project directory
            cd ~/cayhesabim
            
            # Pull latest changes
            git fetch origin main
            git reset --hard origin/main
            
            # Create/Update .env file with secrets
            cat > .env << 'EOF'
            NODE_ENV=production
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_DATABASE=${{ secrets.DB_DATABASE }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            JWT_EXPIRES_IN=7d
            JWT_REFRESH_EXPIRES_IN=7d
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            RESEND_FROM=${{ secrets.RESEND_FROM }}
            APP_URL=${{ secrets.APP_URL }}
            EOF
            
            # Build and deploy with Docker Compose
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml build --no-cache
            docker compose -f docker-compose.prod.yml up -d
            
            # Cleanup unused Docker resources
            docker system prune -f
            
            # Health check
            sleep 10
            curl -f http://localhost/api/health || echo "Health check pending..."
            
            echo "✅ Deployment completed successfully!"

      - name: Deployment Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "🚀 Deployment successful!"
          else
            echo "❌ Deployment failed!"
            exit 1
          fi
