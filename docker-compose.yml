# Docker Compose - Local Development
# Usage: docker-compose up -d

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: cayhesabim-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cayhesabim
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (Development - Hot Reload)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: cayhesabim-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: cayhesabim
      JWT_SECRET: dev-jwt-secret-change-in-production
      JWT_REFRESH_SECRET: dev-jwt-refresh-secret-change-in-production
      JWT_EXPIRES_IN: 7d
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-your-mailgun-api-key}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-your-mailgun-domain}
      MAILGUN_FROM: Çay Üreticisi Platformu <noreply@cayplatformu.com>
      APP_URL: http://localhost:5173
    volumes:
      - ./apps/api/src:/app/apps/api/src:ro
      - api_uploads:/app/apps/api/uploads
    ports:
      - "3000:3000"

  # Frontend (Development - Hot Reload)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: cayhesabim-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:3000/api
    volumes:
      - ./apps/web/src:/app/apps/web/src:ro
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  api_uploads:
