<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon-48.png" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <!-- Mobil / Capacitor viewport: safe-area destegi (iPhone centik, Dynamic Island) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- iOS Web App destegi -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Çay Hesabım" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Android Chrome tema rengi -->
  <meta name="theme-color" content="#16a34a" />
  <meta name="mobile-web-app-capable" content="yes" />

  <meta name="description" content="Çay Üreticisi Platformu - Çay üreticileri için dijital çözüm" />

  <!-- Sosyal paylasim onizlemeleri -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Çay Hesabım" />
  <meta property="og:title" content="Çay Hesabım" />
  <meta property="og:description" content="Çay üreticileri için dijital hesap ve iş takip platformu." />
  <meta property="og:url" content="https://cayhesabim.com/" />
  <meta property="og:image" content="https://cayhesabim.com/social/og-image.png" />
  <meta property="og:image:secure_url" content="https://cayhesabim.com/social/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Çay Hesabım marka logosu" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Çay Hesabım" />
  <meta name="twitter:description" content="Çay üreticileri için dijital hesap ve iş takip platformu." />
  <meta name="twitter:image" content="https://cayhesabim.com/social/twitter-image.png" />
  <meta name="twitter:image:alt" content="Çay Hesabım marka logosu" />

  <title>Çay Hesabım</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <script>
    (function () {
      var t = localStorage.getItem('cayhesabim-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
