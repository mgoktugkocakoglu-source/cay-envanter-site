<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/src/assets/images/favicon.ico" />

  <!-- Mobil / Capacitor viewport: safe-area desteği (iPhone çentik, Dynamic Island) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- iOS Web App desteği -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Çay Hesabım" />

  <!-- Android Chrome tema rengi -->
  <meta name="theme-color" content="#16a34a" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Uygulama açıklaması -->
  <meta name="description" content="Çay Üreticisi Platformu - Çay üreticileri için dijital çözüm" />

  <!-- iOS uygulama ikonu (PWA fallback) -->
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />

  <title>Çay Hesabım</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <script>
    (function () {
      var t = localStorage.getItem('cayhesabim-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
