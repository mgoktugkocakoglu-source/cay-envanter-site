<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48">
  <!-- Icon box: rounded square -->
  <rect x="0" y="2" width="44" height="44" rx="11" fill="#1a5c2a"/>

  <!-- Open notebook left page -->
  <path d="M7 14 Q7 12 9 12 L21 12 L21 36 L9 36 Q7 36 7 34 Z" fill="rgba(255,255,255,0.92)" stroke="none"/>
  <!-- Left page lines -->
  <line x1="10" y1="18" x2="19" y2="18" stroke="rgba(26,92,42,0.25)" stroke-width="1" stroke-linecap="round"/>
  <line x1="10" y1="22" x2="19" y2="22" stroke="rgba(26,92,42,0.25)" stroke-width="1" stroke-linecap="round"/>
  <line x1="10" y1="26" x2="19" y2="26" stroke="rgba(26,92,42,0.25)" stroke-width="1" stroke-linecap="round"/>

  <!-- Open notebook right page -->
  <path d="M23 12 L35 12 Q37 12 37 14 L37 34 Q37 36 35 36 L23 36 Z" fill="rgba(255,255,255,0.92)" stroke="none"/>
  <!-- Right page lines -->
  <line x1="25" y1="18" x2="34" y2="18" stroke="rgba(26,92,42,0.25)" stroke-width="1" stroke-linecap="round"/>
  <line x1="25" y1="22" x2="34" y2="22" stroke="rgba(26,92,42,0.25)" stroke-width="1" stroke-linecap="round"/>
  <line x1="25" y1="26" x2="34" y2="26" stroke="rgba(26,92,42,0.25)" stroke-width="1" stroke-linecap="round"/>

  <!-- Spine -->
  <rect x="20.5" y="11" width="3" height="26" rx="1.5" fill="#1a5c2a"/>

  <!-- Tea leaf big (right) -->
  <path d="M22 28 Q30 22 32 14 Q26 16 22 28 Z" fill="#4caf50"/>
  <!-- Tea leaf small (left) -->
  <path d="M22 28 Q16 22 14 16 Q20 18 22 28 Z" fill="#81c784" opacity="0.85"/>
  <!-- Stem -->
  <line x1="22" y1="36" x2="22" y2="28" stroke="#4caf50" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Divider -->
  <line x1="56" y1="8" x2="56" y2="40" stroke="#e0e0e0" stroke-width="1"/>

  <!-- "Çay" bold dark -->
  <text x="66" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#111111" letter-spacing="-0.5">Çay</text>
  <!-- " Hesabım" thin green -->
  <text x="101" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="300" fill="#1a5c2a" letter-spacing="-0.5"> Hesabım</text>
</svg>
